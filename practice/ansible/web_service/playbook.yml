---
- name: Установка персонального веб-сервера
  hosts: localhost
  gather_facts: yes
  become: yes
  become_method: sudo
  vars:
    username: "student"
    http_port: "{{ 8000 + (username | length) * 10 }}"
  tasks:
    - name: 0. Установить python3 (если не установлен) — модуль package
      ansible.builtin.package:
        name: python3
        state: present

    - name: 1. Гарантировать наличие пользователя в системе
      ansible.builtin.user:
        name: "{{ username }}"
        state: present
        shell: /bin/bash

    - name: 2. Создать рабочую директорию для сайта
      ansible.builtin.file:
        path: "/tmp/ansible_test_{{ username }}"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0755'

    - name: 3. Создать страницу index.html из шаблона j2
      ansible.builtin.template:
        src: index.html.j2
        dest: "/tmp/ansible_test_{{ username }}/index.html"
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: '0644'

    - name: 4. Создать файл сервиса из шаблона и положить его в systemd
      ansible.builtin.template:
        src: myweb.service.j2
        dest: "/etc/systemd/system/myweb_{{ username }}.service"
        mode: '0644'

    - name: 4a. Скопировать скрипт управления сервисом
      ansible.builtin.template:
        src: manage_service.sh.j2
        dest: "/usr/local/bin/manage_{{ username }}_service.sh"
        mode: '0755'

    - name: 5. Активировать, перезагрузить и запустить сервис
      ansible.builtin.systemd_service:
        name: "myweb_{{ username }}.service"
        state: restarted
        enabled: yes
        daemon_reload: yes
